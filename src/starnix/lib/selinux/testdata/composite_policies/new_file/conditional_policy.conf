# Defines conditional booleans and rules for testing conditional policy evaluation.

bool test_cond_first true;
bool test_cond_second false;
bool test_cond_third true;

type test_cond_source_t;
role unconfined_r types test_cond_source_t;
type test_cond_target_file_t, file_like_a;

# 1. Base unconditional rule
allow test_cond_source_t test_cond_target_file_t:file { getattr };

# 2. Single boolean condition (evaluates to true: test_cond_first = true)
if (test_cond_first) {
  allow test_cond_source_t test_cond_target_file_t:file { read };
} else {
  allow test_cond_source_t test_cond_target_file_t:file { open };
}

# 3. Complex expression with AND, NOT (evaluates to true: true && !false)
if (test_cond_first && !test_cond_second) {
  allow test_cond_source_t test_cond_target_file_t:file { write };
}

# 4. Complex expression with OR, XOR (evaluates to false: false || (true ^ true))
if (test_cond_second || (test_cond_first ^ test_cond_third)) {
  allow test_cond_source_t test_cond_target_file_t:file { execute };
}

# 5. Complex expression with EQ (evaluates to true: true == true)
if (test_cond_first == test_cond_third) {
  allow test_cond_source_t test_cond_target_file_t:file { append };
  auditallow test_cond_source_t test_cond_target_file_t:file { setattr };
}
