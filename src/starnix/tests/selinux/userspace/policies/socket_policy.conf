# Attribute for setting /proc/self/attr/sockcreate
attribute socket_test_a;
allow socket_test_a self:process { setsockcreate };

# Test domain for creating sockets without type transitions
type socket_test_no_trans_t, test_a, socket_test_a;
allow socket_test_no_trans_t self:unix_stream_socket { create getattr };
allow socket_test_no_trans_t self:unix_dgram_socket { create getattr };
allow socket_test_no_trans_t self:tcp_socket { create getattr };
allow socket_test_no_trans_t self:udp_socket { create getattr };
allow socket_test_no_trans_t self:packet_socket { create getattr };
allow socket_test_no_trans_t self:netlink_route_socket { create getattr };

# Domain for socket testing
type socket_test_t, test_a, socket_test_a;

# Label unix stream sockets created by "socket_test_t" with "unix_stream_socket_test_t"
type unix_stream_socket_test_t;
type_transition socket_test_t self:unix_stream_socket unix_stream_socket_test_t;
allow socket_test_t unix_stream_socket_test_t:unix_stream_socket { create getattr bind };

# Label unix dgram sockets created by "socket_test_t" with "unix_dgram_socket_test_t"
type unix_dgram_socket_test_t;
type_transition socket_test_t self:unix_dgram_socket unix_dgram_socket_test_t;
allow socket_test_t unix_dgram_socket_test_t:unix_dgram_socket { create getattr read write setopt sendto };
allow unix_dgram_socket_test_t unix_dgram_socket_test_t:unix_dgram_socket { sendto };

# Label TCP sockets created by "socket_test_t" with "tcp_socket_test_t"
type tcp_socket_test_t;
type_transition socket_test_t self:tcp_socket tcp_socket_test_t;
allow socket_test_t tcp_socket_test_t:tcp_socket { create getattr };

# Label UDP sockets created by "socket_test_t" with "udp_socket_test_t"
type udp_socket_test_t;
type_transition socket_test_t self:udp_socket udp_socket_test_t;
allow socket_test_t udp_socket_test_t:udp_socket { create getattr };

# Label raw IP sockets created by "socket_test_t" with "rawip_socket_test_t"
type rawip_socket_test_t;
type_transition socket_test_t self:rawip_socket rawip_socket_test_t;
allow socket_test_t rawip_socket_test_t:rawip_socket { create getattr };

# Label packet sockets created by "socket_test_t" with "packet_socket_test_t"
type packet_socket_test_t;
type_transition socket_test_t self:packet_socket packet_socket_test_t;
allow socket_test_t packet_socket_test_t:packet_socket { create getattr };

# Label netlink route sockets created by "socket_test_t" with "netlink_route_socket_test_t"
type netlink_route_socket_test_t;
type_transition socket_test_t self:netlink_route_socket netlink_route_socket_test_t;
allow socket_test_t netlink_route_socket_test_t:netlink_route_socket { create getattr };

# Label netlink sockets created by "socket_test_t" with "netlink_socket_test_t"
type netlink_socket_test_t;
type_transition socket_test_t self:netlink_socket netlink_socket_test_t;
allow socket_test_t netlink_socket_test_t:netlink_socket { create getattr };

# Associate the test role with socket types
role test_r types { unix_stream_socket_test_t unix_dgram_socket_test_t tcp_socket_test_t udp_socket_test_t rawip_socket_test_t packet_socket_test_t netlink_route_socket_test_t netlink_socket_test_t socket_listen_yes_t socket_listen_no_t socket_sendmsg_test_t socket_sendmsg_yes_t socket_sendmsg_no_t netlink_socket_nlmsg_getneigh_t netlink_socket_nlmsg_read_t netlink_socket_nlmsg_write_t netlink_socket_nlmsg_readpriv_t netlink_socket_nlmsg_relay_t netlink_socket_nlmsg_tty_audit_t netlink_socket_no_nlmsg_t socket_recvmsg_test_t socket_recvmsg_yes_t socket_recvmsg_no_t socket_getname_test_t socket_getname_yes_t socket_getname_no_t socket_accept_test_t socket_accept_yes_t socket_accept_no_t socket_accept_only_test_t socket_bind_test_sock_file_create_no_t socket_bind_test_dir_write_no_t socket_bind_test_dir_add_name_no_t socket_bind_test_yes_t socket_dgram_connect_sender_t socket_dgram_connect_receiver_t };

# Label socket files created by "socket_test_t" in tmpfs with "sock_file_test_t"
type sock_file_test_t;
type_transition socket_test_t tmpfs_t:sock_file sock_file_test_t;
allow socket_test_t tmpfs_t:dir { search write add_name };
allow sock_file_test_t tmpfs_t:filesystem { associate };
allow socket_test_t sock_file_test_t:sock_file { create getattr };

# Types for testing socket listen
type socket_listen_test_t, test_a, socket_test_a;
type socket_listen_yes_t;
type socket_listen_no_t;

allow socket_listen_test_t socket_listen_yes_t:tcp_socket { create bind listen };
allow socket_listen_yes_t unconfined_t:tcp_socket { name_bind node_bind };
allow socket_listen_test_t socket_listen_no_t:tcp_socket { create bind };
neverallow socket_listen_test_t socket_listen_no_t:tcp_socket { listen };
allow socket_listen_no_t unconfined_t:tcp_socket { name_bind node_bind };

# Domain for peer-identity socket tests, to distinguish from socket_test_t.
# Note that this domain has no labeling transitions defined.
type socket_test_peer_t;
typeattribute socket_test_peer_t test_a;
role test_r types { socket_test_peer_t };

# Types for testing socket sendmsg
type socket_sendmsg_test_t, test_a, socket_test_a;
type socket_sendmsg_yes_t;
type socket_sendmsg_no_t;

allow socket_sendmsg_test_t socket_sendmsg_yes_t:unix_stream_socket { create write };
allow socket_sendmsg_test_t socket_sendmsg_no_t:unix_stream_socket { create };
neverallow socket_sendmsg_test_t socket_sendmsg_no_t:unix_stream_socket { write };

# Types for testing socket recvmsg
type socket_recvmsg_test_t, test_a, socket_test_a;
type socket_recvmsg_yes_t;
type socket_recvmsg_no_t;

allow socket_recvmsg_test_t socket_recvmsg_yes_t:unix_stream_socket { create write read };
allow socket_recvmsg_test_t socket_recvmsg_no_t:unix_stream_socket { create write };
neverallow socket_recvmsg_test_t socket_recvmsg_no_t:unix_stream_socket { read };


# Types for testing socket getsockname/getpeername
type socket_getname_test_t, test_a, socket_test_a;
type socket_getname_yes_t;
type socket_getname_no_t;

allow socket_getname_test_t tmpfs_t:dir { search write add_name };
allow socket_getname_test_t tmpfs_t:sock_file { create write };
allow tmpfs_t self:filesystem { associate };
allow socket_getname_test_t socket_getname_yes_t:unix_stream_socket { create bind listen accept getattr };
allow socket_getname_test_t socket_getname_no_t:unix_stream_socket { create connect };
allow socket_getname_no_t socket_getname_yes_t:unix_stream_socket { connectto };
neverallow socket_getname_test_t socket_getname_no_t:unix_stream_socket { accept getattr };

# Types for testing socket accept
type socket_accept_test_t, test_a, socket_test_a;
type socket_accept_only_test_t, test_a, socket_test_a;
type socket_accept_yes_t;
type socket_accept_no_t;

allow socket_accept_test_t tmpfs_t:dir { search write add_name };
allow socket_accept_test_t tmpfs_t:sock_file { create write };
allow socket_accept_test_t socket_accept_yes_t:unix_stream_socket { create bind listen };
allow socket_accept_test_t socket_accept_test_t:unix_stream_socket { create connect };
allow socket_accept_test_t socket_accept_yes_t:unix_stream_socket { connectto };
allow socket_accept_only_test_t socket_accept_yes_t:unix_stream_socket { accept };
allow socket_accept_test_t socket_accept_no_t:unix_stream_socket { create bind listen };
allow socket_accept_test_t socket_accept_no_t:unix_stream_socket { connectto };
neverallow socket_accept_test_t socket_accept_no_t:unix_stream_socket { accept };

# Types for testing netlink socket send
type netlink_socket_nlmsg_getneigh_t;
type netlink_socket_nlmsg_read_t;
type netlink_socket_nlmsg_write_t;
type netlink_socket_nlmsg_readpriv_t;
type netlink_socket_nlmsg_relay_t;
type netlink_socket_nlmsg_tty_audit_t;
type netlink_socket_no_nlmsg_t;

allow socket_sendmsg_test_t self:capability { net_admin };
allow socket_sendmsg_test_t netlink_socket_nlmsg_getneigh_t:netlink_route_socket { create read write nlmsg_getneigh };
allow socket_sendmsg_test_t netlink_socket_nlmsg_read_t:netlink_route_socket { create read write nlmsg_read };
allow socket_sendmsg_test_t netlink_socket_nlmsg_readpriv_t:netlink_route_socket { create read write nlmsg_readpriv };
allow socket_sendmsg_test_t netlink_socket_nlmsg_write_t:netlink_route_socket { create read write nlmsg_write };
allow socket_sendmsg_test_t netlink_socket_no_nlmsg_t:netlink_route_socket { create write };
neverallow socket_sendmsg_test_t netlink_socket_no_nlmsg_t:netlink_route_socket { nlmsg_read nlmsg_write nlmsg_readpriv nlmsg_getneigh };

allow socket_sendmsg_test_t self:capability { audit_control audit_write };
allow socket_sendmsg_test_t netlink_socket_nlmsg_read_t:netlink_audit_socket { create read write nlmsg_read };
allow socket_sendmsg_test_t netlink_socket_nlmsg_readpriv_t:netlink_audit_socket { create read write nlmsg_readpriv };
allow socket_sendmsg_test_t netlink_socket_nlmsg_relay_t:netlink_audit_socket { create read write nlmsg_relay };
allow socket_sendmsg_test_t netlink_socket_nlmsg_tty_audit_t:netlink_audit_socket { create read write nlmsg_tty_audit };
allow socket_sendmsg_test_t netlink_socket_nlmsg_write_t:netlink_audit_socket { create read write nlmsg_write };
allow socket_sendmsg_test_t netlink_socket_no_nlmsg_t:netlink_audit_socket { create write };
neverallow socket_sendmsg_test_t netlink_socket_no_nlmsg_t:netlink_audit_socket { nlmsg_read nlmsg_write nlmsg_readpriv nlmsg_relay nlmsg_tty_audit };

allow socket_sendmsg_test_t netlink_socket_nlmsg_read_t:netlink_tcpdiag_socket { create read write nlmsg_read };
allow socket_sendmsg_test_t netlink_socket_no_nlmsg_t:netlink_tcpdiag_socket { create write };
neverallow socket_sendmsg_test_t netlink_socket_no_nlmsg_t:netlink_tcpdiag_socket { nlmsg_read };

allow socket_sendmsg_test_t netlink_socket_nlmsg_read_t:netlink_xfrm_socket { create read write nlmsg_read };
allow socket_sendmsg_test_t netlink_socket_nlmsg_write_t:netlink_xfrm_socket { create read write nlmsg_write };
allow socket_sendmsg_test_t netlink_socket_no_nlmsg_t:netlink_xfrm_socket { create write };
neverallow socket_sendmsg_test_t netlink_socket_no_nlmsg_t:netlink_xfrm_socket { nlmsg_read nlmsg_write };

allow socket_sendmsg_test_t socket_sendmsg_yes_t:netlink_generic_socket { create read write };
allow socket_sendmsg_test_t socket_sendmsg_no_t:netlink_generic_socket { create };
neverallow socket_sendmsg_test_t socket_sendmsg_no_t:netlink_generic_socket { write };

# Types for testing that `sock_file { create }` is required by socket `bind`.
attribute socket_bind_test_a;
allow socket_bind_test_a self:unix_stream_socket { create getattr bind };
allow socket_bind_test_a self:netlink_audit_socket { create write nlmsg_relay };
allow socket_bind_test_a self:capability { audit_write };

type socket_bind_test_sock_file_create_no_t, test_a, socket_test_a, socket_bind_test_a;
neverallow socket_bind_test_sock_file_create_no_t tmpfs_t:sock_file { create };
allow socket_bind_test_sock_file_create_no_t tmpfs_t:dir { write add_name };

type socket_bind_test_dir_write_no_t, test_a, socket_test_a, socket_bind_test_a;
neverallow socket_bind_test_dir_write_no_t tmpfs_t:dir { write };
allow socket_bind_test_dir_write_no_t tmpfs_t:dir { add_name };
allow socket_bind_test_dir_write_no_t tmpfs_t:sock_file { create };

type socket_bind_test_dir_add_name_no_t, test_a, socket_test_a, socket_bind_test_a;
neverallow socket_bind_test_dir_add_name_no_t tmpfs_t:dir { add_name };
allow socket_bind_test_dir_add_name_no_t tmpfs_t:dir { write };
allow socket_bind_test_dir_add_name_no_t tmpfs_t:sock_file { create };

type socket_bind_test_yes_t, test_a, socket_test_a, socket_bind_test_a;
allow socket_bind_test_yes_t tmpfs_t:sock_file { create };
allow socket_bind_test_yes_t tmpfs_t:dir { add_name write };

# Types for testing Unix datagram connect permissions.
type socket_dgram_connect_test_t, test_a, socket_test_a;
type socket_dgram_connect_sender_t;
type socket_dgram_connect_receiver_t;

allow socket_dgram_connect_test_t socket_dgram_connect_receiver_t:unix_dgram_socket { create bind };
allow socket_dgram_connect_test_t socket_dgram_connect_sender_t:unix_dgram_socket { create connect };
neverallow socket_dgram_connect_sender_t socket_dgram_connect_receiver_t:unix_dgram_socket { sendto };

