# Process domain that is valid under initial policy, but omitted on reload.
type test_invalidated_domain_t, test_a;

# Sockets
allow test_invalidated_domain_t self:unix_stream_socket { create bind listen accept read write getattr getopt setopt shutdown };
allow test_invalidated_domain_t unconfined_t:unix_stream_socket { connectto read write getattr getopt };
allow unconfined_t test_invalidated_domain_t:unix_stream_socket { connectto read write getattr getopt };
