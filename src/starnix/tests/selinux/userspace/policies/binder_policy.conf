# To allow tests to kill the context manager.
allow unconfined_t binder_context_manager_test_t:process { sigkill };

# Attribute for all binder tests.
attribute binder_test_a;

# Common permissions for all binder tests.
# Allow use of pipes for interprocess coördination of test actions.
allow binder_test_a unconfined_t:fifo_file { write };
# To allow creating a temporary directory to serve as a mount point.
allow tmpfs_t self:filesystem { associate };
allow binder_test_a tmpfs_t:dir { search };
# To allow access into the binder file-system.
allow binder_test_a binder_test_fs_t:dir { search };
# To allow opening binder and doing `ioctl` calls
allow binder_test_a binder_test_device_t:chr_file { read write ioctl };
# To allow mmaping a buffer with binder
allow binder_test_a binder_test_device_t:chr_file { map };

# Type that only allows opening binder
type binder_open_test_t;
typeattribute binder_open_test_t test_a, binder_test_a;

# Type that allows becoming the binder context manager
type binder_context_manager_test_t;
typeattribute binder_context_manager_test_t test_a, binder_test_a;
# To allow becoming context manager
allow binder_context_manager_test_t binder_context_manager_test_t:binder { set_context_mgr };
# The context manager wants to use sys_nice for some reason.
# This permission is not strictly needed as the tests pass without it,
# but it gets rid of an "avc deny" message.
# TODO: https://fxbug.dev/436505176 - understand why this seems necessary
# and possibly eliminate it.
allow binder_context_manager_test_t self:capability { sys_nice };

# Identical to `binder_context_manager_test_t`, but without the `set_context_mgr` permission.
type binder_no_context_manager_test_t;
typeattribute binder_no_context_manager_test_t test_a, binder_test_a;
neverallow binder_no_context_manager_test_t binder_no_context_manager_test_t:binder { set_context_mgr };
allow binder_no_context_manager_test_t self:capability { sys_nice };

# Type that allows doing ioctl() syscalls to binder.
type binder_ioctl_no_call_test_t;
typeattribute binder_ioctl_no_call_test_t test_a, binder_test_a;
neverallow binder_ioctl_no_call_test_t binder_context_manager_test_t:binder { call };

# Identical to `binder_ioctl_no_call_test_t` with the addition of the `call` permission.
type binder_ioctl_call_test_t;
typeattribute binder_ioctl_call_test_t test_a, binder_test_a;
# To allow doing calls to binder
allow binder_ioctl_call_test_t binder_context_manager_test_t:binder { call };

type binder_impersonation_allow_call_pretransition_t;
typeattribute binder_impersonation_allow_call_pretransition_t test_a, binder_test_a;
allow binder_impersonation_allow_call_pretransition_t binder_context_manager_t:binder { call };

type binder_impersonation_deny_call_pretransition_t;
typeattribute binder_impersonation_deny_call_pretransition_t test_a, binder_test_a;
neverallow binder_impersonation_deny_call_pretransition_t binder_context_manager_t:binder { call };

type binder_impersonation_allow_impersonate_posttransition_t;
typeattribute binder_impersonation_allow_impersonate_posttransition_t test_a, binder_test_a;
allow binder_impersonation_allow_impersonate_posttransition_t binder_impersonation_allow_call_pretransition_t:fd { use };
allow binder_impersonation_allow_impersonate_posttransition_t binder_impersonation_allow_call_pretransition_t:binder { impersonate };
allow binder_impersonation_allow_impersonate_posttransition_t binder_impersonation_deny_call_pretransition_t:fd { use };
allow binder_impersonation_allow_impersonate_posttransition_t binder_impersonation_deny_call_pretransition_t:binder { impersonate };

type binder_impersonation_deny_impersonate_posttransition_t;
typeattribute binder_impersonation_deny_impersonate_posttransition_t test_a, binder_test_a;
allow binder_impersonation_deny_impersonate_posttransition_t binder_impersonation_allow_call_pretransition_t:fd { use };
neverallow binder_impersonation_deny_impersonate_posttransition_t binder_impersonation_allow_call_pretransition_t:binder { impersonate };
allow binder_impersonation_deny_impersonate_posttransition_t binder_impersonation_deny_call_pretransition_t:fd { use };
neverallow binder_impersonation_deny_impersonate_posttransition_t binder_impersonation_deny_call_pretransition_t:binder { impersonate };

# Type for client in the target domain transition discrepancy test.
type binder_target_domain_transition_client_t;
typeattribute binder_target_domain_transition_client_t test_a, binder_test_a;
allow binder_target_domain_transition_client_t binder_context_manager_t:binder { call };

# Type that allows becoming the context manager in "three-process" tests.
type binder_context_manager_t;
typeattribute binder_context_manager_t test_a, binder_test_a;
allow binder_context_manager_t binder_context_manager_t:binder { set_context_mgr };
allow binder_context_manager_t binder_service_client_t:binder { transfer };
# TODO: https://fxbug.dev/436505176 - this is probably related to the appearance
# of 0x7f in the flags of certain BC_TRANSACTIONs in the test; look more closely
# at that.
allow binder_context_manager_t self:capability { sys_nice };

# Type for the service provider in "three-process" tests.
type binder_service_provider_t;
typeattribute binder_service_provider_t test_a, binder_test_a;
# When the service provider registers itself with the context manager as a
# service provider, that's a call, and it's also a transfer.
allow binder_service_provider_t binder_context_manager_t:binder { call transfer };
# TODO: https://fxbug.dev/436505176 - this is probably related to the appearance
# of 0x7f in the flags of certain BC_TRANSACTIONs in the test; look more closely
# at that.
allow binder_service_provider_t self:capability { sys_nice };

# Type for the client in "three-process" tests.
type binder_service_client_t;
typeattribute binder_service_client_t test_a, binder_test_a;
allow binder_service_client_t binder_test_device_t:chr_file { getattr };
allow binder_service_client_t binder_context_manager_t:binder { call transfer };
allow binder_service_client_t binder_service_provider_t:binder { call impersonate };
allow binder_service_client_t binder_service_provider_t:fd { use };
# TODO: https://fxbug.dev/436505176 - this is probably related to the appearance
# of 0x7f in the flags of certain BC_TRANSACTIONs in the test; look more closely
# at that.
allow binder_service_client_t self:capability { sys_nice };

# Allow tests to kill the context manager and service provider.
allow unconfined_t binder_context_manager_t:process { sigkill };
allow unconfined_t binder_service_provider_t:process { sigkill };

# Assign binder-specific types to the binder filesystem.
type binder_test_fs_t;
typeattribute binder_test_fs_t file_like_a;
type binder_test_device_t;
typeattribute binder_test_device_t file_like_a;
genfscon binder / test_u:object_r:binder_test_fs_t:s0 - s0
genfscon binder /binder test_u:object_r:binder_test_device_t:s0 - s0

# TODO: https://fxbug.dev/422968534 - eliminate this.
attribute binder_422968534_a;
allow binder_422968534_a file_t:chr_file { ioctl map read write };
typeattribute binder_impersonation_allow_call_pretransition_t binder_422968534_a;
typeattribute binder_impersonation_deny_call_pretransition_t binder_422968534_a;
typeattribute binder_impersonation_allow_impersonate_posttransition_t binder_422968534_a;
typeattribute binder_impersonation_deny_impersonate_posttransition_t binder_422968534_a;
typeattribute binder_context_manager_t binder_422968534_a;
typeattribute binder_service_provider_t binder_422968534_a;
typeattribute binder_service_client_t binder_422968534_a;
typeattribute binder_target_domain_transition_client_t binder_422968534_a;
