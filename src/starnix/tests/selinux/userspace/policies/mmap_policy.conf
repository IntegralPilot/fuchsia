# Attribute for domains in mmap tests.
attribute test_mmap_a;

# Parent domain that creates and opens test files.
type test_mmap_parent_t, test_a, test_mmap_a;

# File type used to label test files in tmpfs.
type test_mmap_file_t, file_like_a;
allow test_mmap_file_t tmpfs_t:filesystem { associate };

# Allow tmpfs directory operations for test file creation and cleanup.
allow test_mmap_a tmpfs_t:dir { search write add_name remove_name };
allow test_mmap_a test_mmap_file_t:file { unlink };

# Allow the parent domain to create and open files in tmpfs.
allow test_mmap_parent_t test_mmap_file_t:file { create read write open getattr setattr map };
allow test_mmap_parent_t self:process { setfscreate };

# Domain lacking `fd { use }` on the parent domain, but granted all file permissions.
type test_mmap_child_no_use_fd_t, test_a, test_mmap_a;
neverallow test_mmap_child_no_use_fd_t test_mmap_parent_t:fd { use };
allow test_mmap_child_no_use_fd_t test_mmap_file_t:file *;

# Domain lacking `file { map }` permission.
type test_mmap_child_no_map_t, test_a, test_mmap_a;
allow test_mmap_child_no_map_t test_mmap_parent_t:fd { use };
neverallow test_mmap_child_no_map_t test_mmap_file_t:file { map };
allow test_mmap_child_no_map_t test_mmap_file_t:file { open read write getattr };

# Domain lacking `file { read }` permission.
type test_mmap_child_no_read_t, test_a, test_mmap_a;
allow test_mmap_child_no_read_t test_mmap_parent_t:fd { use };
neverallow test_mmap_child_no_read_t test_mmap_file_t:file { read };
allow test_mmap_child_no_read_t test_mmap_file_t:file { open write map getattr };

# Domain lacking `file { write }` permission.
type test_mmap_child_no_write_t, test_a, test_mmap_a;
allow test_mmap_child_no_write_t test_mmap_parent_t:fd { use };
neverallow test_mmap_child_no_write_t test_mmap_file_t:file { write };
allow test_mmap_child_no_write_t test_mmap_file_t:file { open read map getattr };

# Allow shared library and executable access on Linux.
allow test_mmap_a file_t:file { read getattr map execute };
allow test_mmap_a file_t:dir { getattr };
allow test_mmap_a unlabeled_t:file { read getattr map execute };
