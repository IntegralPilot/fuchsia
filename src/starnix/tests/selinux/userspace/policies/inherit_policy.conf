# Attribute for child domains in inheritance tests.
attribute test_inherit_child_a;

# Attribute for domains that can exec into a child domain.
attribute test_inherit_exec_to_child_a;

# Parent domain for inheritance tests.
type test_inherit_parent_t, test_inherit_exec_to_child_a, test_a;

# Intermediate domain that transitions to one of the child domains on exec.
type test_inherit_bridge_t, test_inherit_exec_to_child_a, test_a;

# A type that can execute a binary without a domain transition.
type test_inherit_constant_t, test_inherit_exec_to_child_a, test_inherit_child_a, test_a;

# Child domain that does not have the `use` permission for file descriptors
# labeled with the parent's security context.
type test_inherit_child_no_use_fd_t, test_a, test_inherit_child_a;
neverallow test_inherit_child_no_use_fd_t test_inherit_parent_t:fd { use };
allow test_inherit_child_no_use_fd_t tmpfs_t:file { read };

# Child domain that does have the `use` permission for file descriptors
# labeled with the parent's security context, but does not have the `read`
# permission for file nodes with type `tmpfs_t`.
type test_inherit_child_no_read_file_t, test_a, test_inherit_child_a;
allow test_inherit_child_no_read_file_t test_inherit_parent_t:fd { use };
neverallow test_inherit_child_no_read_file_t tmpfs_t:file { read };

# Child domain that has the `use` permission for file descriptors labeled with
# the parent's security context, as well as the `read` permission for files
# with type `tmpfs_t`.
type test_inherit_child_allow_use_fd_t, test_a, test_inherit_child_a;
allow test_inherit_child_allow_use_fd_t test_inherit_parent_t:fd { use };
allow test_inherit_child_allow_use_fd_t tmpfs_t:file { read };

# Child domain such that the parent domain does not have the `siginh`
# process permission for that child domain.
type test_inherit_child_no_siginh_t, test_a, test_inherit_child_a;
allow test_inherit_child_no_siginh_t test_inherit_parent_t:fd { use };
neverallow test_inherit_parent_t test_inherit_child_no_siginh_t:process { siginh };

# Child domain such that the parent domain does have the `siginh`
# process permission for that child domain.
type test_inherit_child_allow_siginh_t, test_a, test_inherit_child_a;
allow test_inherit_child_allow_siginh_t test_inherit_parent_t:fd { use };
allow test_inherit_parent_t test_inherit_child_allow_siginh_t:process { siginh };

# Child domain such that the parent domain does not have the `rlimitinh`
# process permission for that child domain.
type test_inherit_child_no_rlimitinh_t, test_a, test_inherit_child_a;
allow test_inherit_child_no_rlimitinh_t test_inherit_parent_t:fd { use };
neverallow test_inherit_parent_t test_inherit_child_no_rlimitinh_t:process { rlimitinh };

# Child domain such that the parent domain does have the `rlimitinh`
# process permission for that child domain.
type test_inherit_child_allow_rlimitinh_t, test_a, test_inherit_child_a;
allow test_inherit_child_allow_rlimitinh_t test_inherit_parent_t:fd { use };
allow test_inherit_parent_t test_inherit_child_allow_rlimitinh_t:process { rlimitinh };

# Child domain such that the parent domain does not have the `noatsecure` process permission
# for that child domain.
type test_inherit_child_deny_noatsecure_t, test_a, test_inherit_child_a;
allow test_inherit_child_deny_noatsecure_t test_inherit_parent_t:fd { use };
neverallow test_inherit_parent_t test_inherit_child_deny_noatsecure_t:process { noatsecure };

# Child domain such that the parent domain has the `noatsecure` process permission for
# that child domain.
type test_inherit_child_allow_noatsecure_t, test_a, test_inherit_child_a;
allow test_inherit_child_allow_noatsecure_t test_inherit_parent_t:fd { use };
allow test_inherit_parent_t test_inherit_child_allow_noatsecure_t:process { noatsecure };

# Allow files in tmpfs to be labeled with type `tmpfs_t`.
allow tmpfs_t self:filesystem { associate };

# Allow the parent to create and open files in tmpfs.
allow test_inherit_parent_t tmpfs_t:dir { search add_name };
allow test_inherit_parent_t tmpfs_t:file { read create setattr };

# Allow the parent to send signals to itself and set resource limits.
allow test_inherit_parent_t self:process { signal setrlimit getrlimit };

# Allow the child to get its own rlimits and those of the init task.
allow test_inherit_child_a self:process { getrlimit };
allow test_inherit_child_a unconfined_t:process { getrlimit };

# Allow the exec-to-child domains to set the "exec" context.
allow test_inherit_exec_to_child_a self:process { setexec };

# Allow the exec-to-child domain to execute files in /data/bin/.
allow test_inherit_exec_to_child_a file_t:file { read execute };

# Allow the exec-to-child domains to transition to the child domains.
allow test_inherit_exec_to_child_a test_inherit_child_a:process { transition };

# Allow the child domains to use files in /data/bin as an entry point.
allow test_inherit_child_a file_t:file { read entrypoint };

# Allow the child to stat files in tmpfs.
allow test_inherit_child_a tmpfs_t:dir { getattr };
allow test_inherit_child_a tmpfs_t:file { getattr };

# Allow the child to stat the selinuxfs null file.
allow test_inherit_child_a devnull_t:chr_file { getattr };

# Allow use of included files and shared libraries(?)
allow test_inherit_exec_to_child_a unlabeled_t:file { read };
allow test_inherit_exec_to_child_a file_t:file { read };
allow test_inherit_child_a unlabeled_t:file { read getattr map execute };
allow test_inherit_child_a file_t:dir { getattr };
allow test_inherit_child_a file_t:file { read getattr map execute };
allow test_inherit_child_a self:lnk_file { read };

# Allow the child to read its own files
allow test_inherit_child_a self:file { read getattr };

# Allow the constant domain to retain the same security context when
# executing a binary in /data/bin/.
allow test_inherit_constant_t test_pkg_file_t:file { execute_no_trans };

# File labels for script files, PT_INTERP test executables, and interpreters in execution tests.
type test_inherit_script_file_t, file_like_a;
type test_inherit_custom_interp_exec_file_t, file_like_a;
type test_inherit_interp_file_t, file_like_a;
allow test_inherit_script_file_t tmpfs_t:filesystem { associate };
allow test_inherit_custom_interp_exec_file_t tmpfs_t:filesystem { associate };
allow test_inherit_interp_file_t tmpfs_t:filesystem { associate };

# Target domain for script and PT_INTERP execution tests.
# For #! scripts, the target domain only requires `entrypoint` on the script file (since the
# interpreter ELF is loaded instead), whereas for PT_INTERP executables the target domain maps
# and executes the main ELF binary (`entrypoint`, `read`, `map`, `execute`).
type test_inherit_script_target_t, test_a, test_inherit_child_a;
type_transition test_inherit_parent_t test_inherit_script_file_t:process test_inherit_script_target_t;
type_transition test_inherit_parent_t test_inherit_custom_interp_exec_file_t:process test_inherit_script_target_t;
allow test_inherit_script_target_t test_inherit_script_file_t:file { entrypoint };
allow test_inherit_script_target_t test_inherit_custom_interp_exec_file_t:file { entrypoint read map execute };
allow test_inherit_parent_t test_inherit_script_target_t:process { transition };
allow test_inherit_parent_t test_inherit_script_file_t:file { read execute };
allow test_inherit_parent_t test_inherit_custom_interp_exec_file_t:file { read execute };
allow test_inherit_parent_t test_inherit_interp_file_t:file { read execute };
allow test_inherit_script_target_t test_inherit_interp_file_t:file { read map execute };
allow test_inherit_script_target_t test_inherit_parent_t:fd { use };

# Caller domain that lacks execute permission on the interpreter.
type test_inherit_parent_no_interp_exec_t, test_inherit_exec_to_child_a, test_a;
type_transition test_inherit_parent_no_interp_exec_t test_inherit_script_file_t:process test_inherit_script_target_t;
type_transition test_inherit_parent_no_interp_exec_t test_inherit_custom_interp_exec_file_t:process test_inherit_script_target_t;
allow test_inherit_parent_no_interp_exec_t test_inherit_script_file_t:file { read execute };
allow test_inherit_parent_no_interp_exec_t test_inherit_custom_interp_exec_file_t:file { read execute };
allow test_inherit_parent_no_interp_exec_t test_inherit_interp_file_t:file { read };
neverallow test_inherit_parent_no_interp_exec_t test_inherit_interp_file_t:file { execute };
allow test_inherit_script_target_t test_inherit_parent_no_interp_exec_t:fd { use };

# Target child domain lacking execute permission on the interpreter.
type test_inherit_script_no_interp_exec_t, test_a, test_inherit_child_a;
allow test_inherit_script_no_interp_exec_t test_inherit_script_file_t:file { entrypoint };
allow test_inherit_script_no_interp_exec_t test_inherit_custom_interp_exec_file_t:file { entrypoint read map execute };
allow test_inherit_script_no_interp_exec_t test_inherit_interp_file_t:file { read map };
allow test_inherit_script_no_interp_exec_t test_inherit_parent_t:fd { use };
neverallow test_inherit_script_no_interp_exec_t test_inherit_interp_file_t:file { execute };

# Target child domain lacking read permission on the interpreter.
type test_inherit_script_no_interp_read_t, test_a, test_inherit_child_a;
allow test_inherit_script_no_interp_read_t test_inherit_script_file_t:file { entrypoint };
allow test_inherit_script_no_interp_read_t test_inherit_custom_interp_exec_file_t:file { entrypoint read map execute };
allow test_inherit_script_no_interp_read_t test_inherit_interp_file_t:file { map execute };
allow test_inherit_script_no_interp_read_t test_inherit_parent_t:fd { use };
neverallow test_inherit_script_no_interp_read_t test_inherit_interp_file_t:file { read };

# Target child domain lacking map permission on the interpreter.
type test_inherit_script_no_interp_map_t, test_a, test_inherit_child_a;
allow test_inherit_script_no_interp_map_t test_inherit_script_file_t:file { entrypoint };
allow test_inherit_script_no_interp_map_t test_inherit_custom_interp_exec_file_t:file { entrypoint read map execute };
allow test_inherit_script_no_interp_map_t test_inherit_interp_file_t:file { read execute };
allow test_inherit_script_no_interp_map_t test_inherit_parent_t:fd { use };
neverallow test_inherit_script_no_interp_map_t test_inherit_interp_file_t:file { map };

### The lines below are only needed on Linux.

# Allow the child domains to use files in /data/bin as an entry point.
allow test_inherit_child_a unlabeled_t:file { read entrypoint };

# Allow the constant domain to retain the same security context when
# executing a binary in /data/bin/.
allow test_inherit_constant_t unlabeled_t:file { execute_no_trans };

# Allow the parent to read the file containing the child program.
# The difference between Linux and Starnix is due to a labeling difference.
allow test_inherit_parent_t unlabeled_t:file { read getattr };

# Related to shared object use.
allow test_inherit_exec_to_child_a unlabeled_t:file { execute };

# Related to /dev/console use.
allow test_inherit_exec_to_child_a unlabeled_t:chr_file { getattr };
allow test_inherit_child_a unlabeled_t:chr_file { read getattr };

# Related to null file check.
# The difference between Linux and Starnix is at least partly due to a labeling difference.
allow test_inherit_child_a unconfined_t:chr_file { read write getattr };

# Related to missing directory permission checks in SEStarnix?
allow test_inherit_parent_t tmpfs_t:dir { write };
allow test_inherit_exec_to_child_a tmpfs_t:dir { search };
allow test_inherit_child_a tmpfs_t:dir { search };

# Related to a missing permission check in `open` (via `mkstemp`)?
allow test_inherit_parent_t tmpfs_t:file { write };

# Related to some missing file permission checks in SEStarnix?
allow test_inherit_child_a devnull_t:chr_file { read write };

# TODO: https://fxbug.dev/322843830 - Should be required on Starnix.
# Related to the SELinux/SEStarnix difference demonstrated in
# https://fuchsia-review.googlesource.com/c/fuchsia/+/1277457.
allow test_inherit_child_a test_inherit_bridge_t:fd { use };

# Related to misc permissions not yet implemented in SEStarnix.
allow test_inherit_exec_to_child_a self:capability { dac_read_search dac_override };

# Allow unbounded transitions despite running from a nosuid-mounted package.
policycap nnp_nosuid_transition;
allow test_a test_a:process2 { nosuid_transition };
