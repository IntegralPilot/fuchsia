# Attribute for caller domains in pidfd tests.
attribute test_pidfd_caller_a;

# Target domain that owns the file descriptor to be fetched via pidfd_getfd.
type test_pidfd_target_t, test_a;

# File type opened by the target domain.
type test_pidfd_file_t, file_like_a;
allow test_pidfd_file_t tmpfs_t:filesystem { associate };

# Allow target domain to open the test file and use sync pipes.
allow test_pidfd_target_t test_pidfd_file_t:file { open read write append getattr };
allow test_pidfd_target_t unconfined_t:fifo_file { read write };

# Allow unconfined_t to signal/kill test domains during teardown.
allow unconfined_t test_a:process { signal sigkill };
allow test_a unconfined_t:process { sigchld };

# Common permissions for caller domains in pidfd tests.
allow test_pidfd_caller_a unconfined_t:fifo_file { read write };
allow test_pidfd_caller_a self:capability { sys_ptrace };

# 1. Caller domain allowed all required permissions: `process { ptrace }`, `fd { use }`, and `file { read write }`.
type test_pidfd_allow_all_t, test_pidfd_caller_a, test_a;
allow test_pidfd_allow_all_t test_pidfd_target_t:process { ptrace };
allow test_pidfd_allow_all_t test_pidfd_target_t:fd { use };
allow test_pidfd_allow_all_t test_pidfd_file_t:file { read write };

# 2. Caller domain allowed `fd { use }` and `file { read write }`, but denied `process { ptrace }`.
type test_pidfd_deny_ptrace_t, test_pidfd_caller_a, test_a;
neverallow test_pidfd_deny_ptrace_t test_pidfd_target_t:process { ptrace };
allow test_pidfd_deny_ptrace_t test_pidfd_target_t:fd { use };
allow test_pidfd_deny_ptrace_t test_pidfd_file_t:file { read write };

# 3. Caller domain allowed `process { ptrace }` and `file { read write }`, but denied `fd { use }`.
type test_pidfd_deny_fd_use_t, test_pidfd_caller_a, test_a;
allow test_pidfd_deny_fd_use_t test_pidfd_target_t:process { ptrace };
neverallow test_pidfd_deny_fd_use_t test_pidfd_target_t:fd { use };
allow test_pidfd_deny_fd_use_t test_pidfd_file_t:file { read write };

# 4. Caller domain allowed `process { ptrace }`, `fd { use }`, and `file { write }`, but denied `file { read }`.
type test_pidfd_deny_file_read_t, test_pidfd_caller_a, test_a;
allow test_pidfd_deny_file_read_t test_pidfd_target_t:process { ptrace };
allow test_pidfd_deny_file_read_t test_pidfd_target_t:fd { use };
neverallow test_pidfd_deny_file_read_t test_pidfd_file_t:file { read };
allow test_pidfd_deny_file_read_t test_pidfd_file_t:file { write };

# 5. Caller domain allowed `process { ptrace }`, `fd { use }`, and `file { read append }`, but denied `file { write }`.
type test_pidfd_deny_file_write_t, test_pidfd_caller_a, test_a;
allow test_pidfd_deny_file_write_t test_pidfd_target_t:process { ptrace };
allow test_pidfd_deny_file_write_t test_pidfd_target_t:fd { use };
allow test_pidfd_deny_file_write_t test_pidfd_file_t:file { read append };
neverallow test_pidfd_deny_file_write_t test_pidfd_file_t:file { write };

# 6. Caller domain allowed `process { ptrace }`, `fd { use }`, and `file { read write }`, but denied `file { append }`.
type test_pidfd_deny_file_append_t, test_pidfd_caller_a, test_a;
allow test_pidfd_deny_file_append_t test_pidfd_target_t:process { ptrace };
allow test_pidfd_deny_file_append_t test_pidfd_target_t:fd { use };
allow test_pidfd_deny_file_append_t test_pidfd_file_t:file { read write };
neverallow test_pidfd_deny_file_append_t test_pidfd_file_t:file { append };
