[package]
name = "bt-bass"
version = "0.0.1"
edition = "2021"
license = "BSD-2-Clause"

[features]
default = []
test-utils = []

[dependencies]
bt-bap = { path = "../bt-bap" }
bt-common = { path = "../bt-common" }
bt-gatt = { path = "../bt-gatt", features = ["test-utils"] }
futures = "=0.3.31"
log = { version = "0.4.29", features = ["kv", "std"] }
pin-project = "1.1"
parking_lot = "0.12.5"
thiserror = "2.0.18"

[dev-dependencies]
assert_matches = "1.5.0"
bt-bass = { path = "../bt-bass", features = ["test-utils"] }
