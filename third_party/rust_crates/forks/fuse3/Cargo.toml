[package]
name = "fuse3"
version = "0.9.0"
authors = ["Sherlock Holo <sherlockya@gmail.com>"]
edition = "2024"
readme = "README.md"
keywords = ["fuse", "filesystem", "system", "bindings"]
categories = ["api-bindings", "filesystem"]
license = "MIT"
repository = "https://github.com/Sherlock-Holo/fuse3"
description = "FUSE user-space library async version implementation."
rust-version = "1.91"

[features]
async-io-runtime = [
    "dep:async-fs",
    "dep:async-global-executor",
    "dep:async-lock",
    "dep:async-io",
    "dep:async-process",
    "futures-util/io",
]
file-lock = []
tokio-runtime = ["dep:tokio"]
unprivileged = [
    "nix/socket",
    "dep:which",
]

[lib]
name = "fuse3"
path = "src/lib.rs"

[dependencies]
async-notify = "0.3"
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
libc = "0.2"
# TODO(https://fxbug.dev/106164) This is a Google change in our fuse3 fork
# This specific version of nix is set to make cargo-gnaw
# pull in the correct version of nix.
# See: https://github.com/Sherlock-Holo/fuse3/pull/64.
nix = { version = "0.29", default-features = false, features = ["fs", "mount", "user"] }
slab = "0.4"
tracing = "0.1"
trait-make = "0.1"
which = { version = "8", optional = true }
zerocopy = { version = "0.8", features = ["derive"] }

[dependencies.async-fs]
version = "2.2.0"
optional = true

[dependencies.async-global-executor]
version = "3.1.0"
optional = true

[dependencies.async-io]
version = "2.6.0"
optional = true

[dependencies.async-lock]
version = "3.4.2"
optional = true

[dependencies.async-process]
version = "2.5.0"
optional = true

[dependencies.tokio]
# TODO(https://fxbug.dev/106164) This is a Google change in our fuse3 fork
# This specific version of tokio is defined because of
# its usages in other places in Fuchsia.
version = "1"
# TODO(https://fxbug.dev/106164) This is a Google change in our fuse3 fork
# Gnaw does not support target-specific features for now.
# The features are manually configured in //third_party/rust_crates/Cargo.toml.
# features = ["fs", "rt", "sync", "net", "macros", "process", "time"]
optional = true

[package.metadata.docs.rs]
features = [ "file-lock", "unprivileged", "tokio-runtime" ]
targets = [
  "i686-unknown-freebsd",
  "i686-unknown-linux-gnu",
  "x86_64-unknown-freebsd",
  "x86_64-unknown-linux-gnu",
]
