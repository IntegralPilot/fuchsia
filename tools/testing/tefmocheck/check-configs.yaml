  - start_string: "RUN   TestKernelLockupDetectorCriticalSection"
    end_string: ": TestKernelLockupDetectorCriticalSection"
  - start_string: "RUN   TestKernelLockupDetectorHeartbeat"
    end_string: ": TestKernelLockupDetectorHeartbeat"
  - start_string: "RUN   TestPmmCheckerOops"
    end_string: ": TestPmmCheckerOops"
  - start_string: "RUN   TestKernelLockupDetectorFatalCriticalSection"
    end_string: ": TestKernelLockupDetectorFatalCriticalSection"
  - start_string: "RUN   TestKernelLockupDetectorFatalHeartbeat"
    end_string: ": TestKernelLockupDetectorFatalHeartbeat"
  # Kernel out-of-memory test "OOMHard" may report valid OOPS that should not reflect a test failure.
  - start_string: "RUN   TestOOMHard"
    end_string: ": TestOOMHard"
  # Suspend e2e test may report a valid OOPS while resuming however the test does not expect resume to succeed.
  # These logs correspond to the beginning and end of the resume logs and do not occur elsewhere in the serial logs.
  - start_string: "Restore GNVS pointer"
