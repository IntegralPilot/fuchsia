- kind: "string_in_log"
  string: "failed to copy image from GCS"
  log_types: ["swarmingOutputType"]

# Error is being logged at https://fuchsia.googlesource.com/fuchsia/+/559948a1a4cbd995d765e26c32923ed862589a61/src/firmware/paver/paver.cc#175
- kind: "string_in_log"
  string: "Failed to stream partitions to FVM"
  log_types: ["swarmingOutputType"]
  # This error may be emitted, but since we retry paving, this may not be
  # fatal.
  skip_passed_task: true

