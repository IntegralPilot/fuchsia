  log_types: ["syslogType"]

# For https://fxbug.dev/500045713
# This is for driver manager removal and bootup hangs.
- kind: "string_in_log"
  string: "Full node removal hanging"
  log_types: ["serialLogType"]
  always_flake: true
  # Ignore driver removal hangs as reboot_hang_test starts until device finishes shutdown
  # or test ends.
  except_blocks:
  - start_string: "Started executing 'test_reboot_to_bootloader_on_hang'"
    end_string: "Shutting down debuglog"
  - start_string: "Started executing 'test_reboot_to_bootloader_on_hang'"
    end_string: "Finished executing 'test_reboot_to_bootloader_on_hang'"
- kind: "string_in_log"
  string: "Package node removal hanging"
  log_types: ["serialLogType"]
  always_flake: true
- kind: "string_in_log"
  string: "waiting for driver's Stop() function and destructor finish running"
  log_types: ["serialLogType"]
  always_flake: true
  # Ignore driver removal hangs as reboot_hang_test starts until device finishes shutdown
  # or test ends.
  except_blocks:
  - start_string: "Started executing 'test_reboot_to_bootloader_on_hang'"
    end_string: "Shutting down debuglog"
  - start_string: "Started executing 'test_reboot_to_bootloader_on_hang'"
    end_string: "Finished executing 'test_reboot_to_bootloader_on_hang'"
- kind: "string_in_log"
  string: "Deadline exceeded in the bootup tracker with:"
  log_types: ["serialLogType"]
  always_flake: true
- kind: "string_in_log"
  string: "waiting for driver to finish binding"
  log_types: ["serialLogType"]
  always_flake: true

# For https://fxbug.dev/42085023. This tracks boot test failures where
# the success string shows up in the serial log but we fail to read it.
- kind: "string_in_log"
  string: "Boot-test-successful!"
  log_types: ["serialLogType"]
  # This failure mode is likely to be infra-related.
  infra_failure: true
  skip_all_passed_tests: true
  always_flake: true

