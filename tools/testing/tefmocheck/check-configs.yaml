# For https://fxbug.dev/42119650.
- kind: "string_in_log"
  string: "Timed out loading dynamic linker from fuchsia.ldsvc.Loader"
  log_types: ["serialLogType", "swarmingOutputType", "syslogType"]

- kind: "string_in_log"
  string: "ERROR: AddressSanitizer"
  log_types: ["serialLogType", "swarmingOutputType", "syslogType"]
  attribute_to_test: true
  emit_synthetic_test_case: true
  except_blocks:
  - start_string: "[===ASAN EXCEPT BLOCK START===]"
    end_string: "[===ASAN EXCEPT BLOCK END===]"

- kind: "string_in_log"
  string: "ERROR: LeakSanitizer"
  log_types: ["serialLogType", "swarmingOutputType", "syslogType"]
  attribute_to_test: true
  except_blocks:
  # startString and endString should match string in //zircon/system/ulib/c/test/sanitizer/lsan-test.cc.
  - start_string: "[===LSAN EXCEPT BLOCK START===]"
    end_string: "[===LSAN EXCEPT BLOCK END===]"
  # Kernel out-of-memory test "OOMHard" may report false positive leaks.
  - start_string: "RUN   TestOOMHard"
    end_string: "PASS: TestOOMHard"
  - start_string: "RUNNING TEST: /boot/test/lsan-test"
    end_string: "[runtests][PASSED] /boot/test/lsan-test"
  - start_string: "RUNNING TEST: /boot/test/lsan-test"
    end_string: "[runtests][FAILED] /boot/test/lsan-test"

- kind: "string_in_log"
  string: "WARNING: ThreadSanitizer"
  log_types: ["serialLogType", "swarmingOutputType", "syslogType"]
  attribute_to_test: true

- kind: "string_in_log"
  string: "SUMMARY: UndefinedBehaviorSanitizer"
  log_types: ["serialLogType", "swarmingOutputType", "syslogType"]
  attribute_to_test: true
  except_blocks:
  - start_string: "[===UBSAN EXCEPT BLOCK START===]"
    end_string: "[===UBSAN EXCEPT BLOCK END===]"

# Match specific OOPS types before finally matching the generic type.
- kind: "string_in_log"
  string: "DRIVER OOPS"
  log_types: ["serialLogType", "swarmingOutputType", "syslogType"]
  attribute_to_test: true
  except_blocks:
  # Forced PCIe driver restarts (e.g. via killall) intentionally trigger DMA quarantine OOPS warnings.
  - start_string: "Started executing 'test_driver_host_restart'"
    end_string: "Finished executing 'test_driver_host_restart'"
  - start_string: " lock_dep_dynamic_analysis_tests "
    end_string: " lock_dep_static_analysis_tests "
  - start_string: "RUN   TestKillCriticalProcess"
    end_string: ": TestKillCriticalProcess"
  - start_string: "RUN   TestKernelLockupDetectorCriticalSection"
    end_string: ": TestKernelLockupDetectorCriticalSection"
  - start_string: "RUN   TestKernelLockupDetectorHeartbeat"
    end_string: ": TestKernelLockupDetectorHeartbeat"
  - start_string: "RUN   TestPmmCheckerOops"
    end_string: ": TestPmmCheckerOops"
  - start_string: "RUN   TestKernelLockupDetectorFatalCriticalSection"
    end_string: ": TestKernelLockupDetectorFatalCriticalSection"
  - start_string: "RUN   TestKernelLockupDetectorFatalHeartbeat"
    end_string: ": TestKernelLockupDetectorFatalHeartbeat"
  # Kernel out-of-memory test "OOMHard" may report valid OOPS that should not reflect a test failure.
  - start_string: "RUN   TestOOMHard"
    end_string: ": TestOOMHard"
  # Suspend e2e test may report a valid OOPS while resuming however the test does not expect resume to succeed.
  # These logs correspond to the beginning and end of the resume logs and do not occur elsewhere in the serial logs.
  - start_string: "Restore GNVS pointer"
    end_string: "platform_halt suggested_action 1 reason 6"

- kind: "string_in_log"
  string: "lockup_detector: no heartbeat from"
  log_types: ["serialLogType", "swarmingOutputType", "syslogType"]
  attribute_to_test: true
  except_blocks:
  # Forced PCIe driver restarts (e.g. via killall) intentionally trigger DMA quarantine OOPS warnings.
  - start_string: "Started executing 'test_driver_host_restart'"
    end_string: "Finished executing 'test_driver_host_restart'"
  - start_string: " lock_dep_dynamic_analysis_tests "
    end_string: " lock_dep_static_analysis_tests "
  - start_string: "RUN   TestKillCriticalProcess"
    end_string: ": TestKillCriticalProcess"
  - start_string: "RUN   TestKernelLockupDetectorCriticalSection"
    end_string: ": TestKernelLockupDetectorCriticalSection"
  - start_string: "RUN   TestKernelLockupDetectorHeartbeat"
    end_string: ": TestKernelLockupDetectorHeartbeat"
  - start_string: "RUN   TestPmmCheckerOops"
    end_string: ": TestPmmCheckerOops"
  - start_string: "RUN   TestKernelLockupDetectorFatalCriticalSection"
    end_string: ": TestKernelLockupDetectorFatalCriticalSection"
  - start_string: "RUN   TestKernelLockupDetectorFatalHeartbeat"
    end_string: ": TestKernelLockupDetectorFatalHeartbeat"
  # Kernel out-of-memory test "OOMHard" may report valid OOPS that should not reflect a test failure.
  - start_string: "RUN   TestOOMHard"
    end_string: ": TestOOMHard"
  # Suspend e2e test may report a valid OOPS while resuming however the test does not expect resume to succeed.
  # These logs correspond to the beginning and end of the resume logs and do not occur elsewhere in the serial logs.
  - start_string: "Restore GNVS pointer"
    end_string: "platform_halt suggested_action 1 reason 6"

- kind: "string_in_log"
  string: "ZIRCON KERNEL OOPS"
  log_types: ["serialLogType", "swarmingOutputType", "syslogType"]
  attribute_to_test: true
  except_blocks:
  # Forced PCIe driver restarts (e.g. via killall) intentionally trigger DMA quarantine OOPS warnings.
  - start_string: "Started executing 'test_driver_host_restart'"
    end_string: "Finished executing 'test_driver_host_restart'"
  - start_string: " lock_dep_dynamic_analysis_tests "
    end_string: " lock_dep_static_analysis_tests "
  - start_string: "RUN   TestKillCriticalProcess"
