# LINT.IfChange(seriallistener_timed_out)
- kind: "string_in_log"
  string: "seriallistener FATAL: timed out before success string"
  log_types: ["serialLogType", "swarmingOutputType", "syslogType"]
  skip_all_passed_tests: true
  always_flake: true
# LINT.ThenChange(/tools/testing/seriallistener/cmd/main.go:timed_out)

# These may be in the output of tests, but the syslog and serial log don't contain any test output.
# `ASSERT FAILED` may show up in crash hexdumps, so prepend with a space to match it when
# it's at the start of a logline.
- kind: "string_in_log"
  string: " ASSERT FAILED"
  log_types: ["serialLogType", "syslogType"]
  except_blocks:
  # These tests deliberately trigger asserts in order to verify that they properly terminate
  # the program.
  - start_string: "[ RUN      ] ZxAssertCppTest.ZxAssertMsgInvalidPredicateFails"
    end_string: "[       OK ] ZxAssertCppTest.ZxAssertMsgInvalidPredicateFails"
  - start_string: "[ RUN      ] ZxAssertCppTest.ZxDebugAssertMsgInvalidPredicateFails"
    end_string: "[       OK ] ZxAssertCppTest.ZxDebugAssertMsgInvalidPredicateFails"
  - start_string: "[ RUN      ] ZxAssertCppTest.ZxAssertInvalidPredicateFails"
    end_string: "[       OK ] ZxAssertCppTest.ZxAssertInvalidPredicateFails"
