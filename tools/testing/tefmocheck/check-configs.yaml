  string: "botanist ERROR: timed out trying to connect to ssh"
  log_types: ["swarmingOutputType"]

# For https://fxbug.dev/42139705.
- kind: "string_in_log"
  string: "syslog: context cancelled while trying to reconnect over SSH"
  log_types: ["swarmingOutputType"]
  only_on_states: ["TIMED_OUT"]

