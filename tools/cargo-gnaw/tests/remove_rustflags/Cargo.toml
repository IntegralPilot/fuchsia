[package]
name = "remove_rustflags"
version = "0.1.0"
edition = "2024"

[dependencies]
example_lib = { version = "1.0", path = "example_lib" }

[gn.package.example_lib."1.0.0"]
rustflags = [ "--cfg=flag_to_remove" ]
remove_rustflags = [ "--cfg=flag_to_remove" ]

[gn.package.example_lib."1.0.0".platform."cfg(target_os = \"fuchsia\")"]
remove_rustflags = [ "--cfg=fuchsia_flag_to_remove" ]
